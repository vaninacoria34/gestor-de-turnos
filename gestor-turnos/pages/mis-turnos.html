<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis turnos · Gestor de Turnos</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/agenda.css"><link rel="stylesheet" href="../css/pantallas.css"></head><body><div class="app"><aside class="sidebar"><h1>▦ Gestor de Turnos</h1><nav id="menu" aria-label="Navegación principal"></nav></aside><main class="main"><div class="agenda-topbar"><span>Gestión del equipo</span><span id="perfil"></span></div><header class="agenda-heading"><div><p class="eyebrow">ORGANIZACIÓN DEL EQUIPO</p><h2>Mis turnos</h2><p class="intro">Tu semana de trabajo y tus solicitudes de cambio.</p></div></header><div id="estado-pagina" role="status" aria-live="polite"></div><section class="page-stats" id="estadisticas" aria-label="Resumen"><div class="page-stat"><strong id="stat-0">—</strong><span>Turnos de la semana</span></div><div class="page-stat"><strong id="stat-1">—</strong><span>De mañana</span></div><div class="page-stat"><strong id="stat-2">—</strong><span>De tarde</span></div></section><div class="page-toolbar"><button class="btn btn-secundario" onclick="mover(-1)" aria-label="Semana anterior">‹</button><strong id="periodo"></strong><button class="btn btn-secundario" onclick="mover(1)" aria-label="Semana siguiente">›</button><button class="btn btn-secundario" onclick="irHoy()">Esta semana</button><a class="btn btn-link" href="solicitudes.html">Ver mis solicitudes</a></div><section class="agenda-panel" id="lista-turnos"></section><dialog id="modal-solicitud" aria-labelledby="titulo-solicitud"><h3 id="titulo-solicitud">Solicitar cambio de turno</h3><p class="page-note" id="ms-info"></p><form id="form-solicitud"><label>Turno deseado<select id="ms-tipo"><option value="manana">Mañana</option><option value="tarde">Tarde</option></select></label><label>Fecha deseada<input type="date" id="ms-fecha" required></label><label>Motivo<te
