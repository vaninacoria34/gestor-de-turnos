<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descansos · Gestor de Turnos</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/agenda.css"><link rel="stylesheet" href="../css/pantallas.css"></head><body><div class="app"><aside class="sidebar"><h1>▦ Gestor de Turnos</h1><nav id="menu"></nav></aside><main class="main"><div class="agenda-topbar"><span>Gestión del equipo</span><span id="perfil"></span></div><header class="agenda-heading"><div><h2>Descansos</h2><p class="intro">Registrá días libres semanales o ausencias en una fecha puntual.</p></div></header><div id="estado-pagina" role="status" aria-live="polite"></div><form id="form-descanso" class="settings-card" hidden><div class="settings-fields"><label>Empleado<select id="empleado" required></select></label><label>Tipo de descanso<select id="tipo"><option value="semanal">Semanal</option><option value="fecha">Fecha puntual</option></select></label><label id="campo-dia">Día de la semana<select id="dia"><option value="0">Domingo</option><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option></select></label><label id="campo-fecha" hidden>Fecha<input type="date" id="fecha"></label><label>Motivo<input id="motivo" placeholder="Opcional"></label></div><div class="settings-actions"><button class="btn">Registrar descanso</button></div></form><div class="page-toolbar" style="margin-top:24px"><button class="btn btn-secundario" onclick="cargar()">Actualizar</button></div><section id="lista" class="agenda-panel"></section></main></div><script src="../js/api.js"></script><script src="../js/interfaz.js"></script><script src="../js/descansos.js"></script></body></html>
